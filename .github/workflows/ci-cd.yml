name: NexusGuard CI/CD
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker-compose up -d
      - run: pytest tests/
      - run: trivy fs .
      - run: helm upgrade --install nexusguard ./infrastructure/helm/nexusguard-core
