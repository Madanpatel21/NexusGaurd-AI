apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexusguard.fullname" . }}-api
  labels:
    {{- include "nexusguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexusguard.selectorLabels" . | nindent 4 }}
