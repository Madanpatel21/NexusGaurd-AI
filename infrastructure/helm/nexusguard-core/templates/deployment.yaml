apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusguard-api
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/nexusguard/api:latest
          ports: [{containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health, port: 8080}}
