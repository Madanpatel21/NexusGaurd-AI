apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: motor-failure-delay
spec:
  action: delay
  mode: one
  selector:
    namespaces: [nexusguard]
    labelSelectors:
      app: edge-agent
  delay:
    latency: "500ms"
    correlation: "50"
  target:
    selector:
      namespaces: [nexusguard]
      labelSelectors:
        app: maintenance-predictor
  duration: "30s"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: motor-failure-pod-kill
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces: [nexusguard]
    labelSelectors:
      app: maintenance-predictor
  duration: "15s"
