{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusguard-frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nexusguard/command-center:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://{{ include "nexusguard.fullname" . }}-api:8080"
            - name: NEXT_PUBLIC_JARVIS_URL
              value: "http://{{ include "nexusguard.fullname" . }}-jarvis:8081"
            - name: NEXT_PUBLIC_WS_URL
              value: "http://{{ include "nexusguard.fullname" . }}-api:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: nexusguard-frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
{{- end }}
