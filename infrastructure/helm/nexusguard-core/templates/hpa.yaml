{{- if .Values.cloudApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nexusguard.fullname" . }}-api-hpa
  labels:
    {{- include "nexusguard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexusguard.fullname" . }}-api
  minReplicas: {{ .Values.cloudApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.cloudApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.cloudApi.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.cloudApi.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
