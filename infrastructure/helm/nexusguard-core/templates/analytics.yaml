{{- if .Values.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusguard-analytics
  labels:
    app: analytics
spec:
  replicas: {{ .Values.analytics.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: ghcr.io/nexusguard/analytics:latest
          ports:
            - containerPort: 8095
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexusguard-analytics
spec:
  selector:
    app: analytics
  ports:
    - protocol: TCP
      port: 8095
      targetPort: 8095
  type: ClusterIP
{{- end }}
