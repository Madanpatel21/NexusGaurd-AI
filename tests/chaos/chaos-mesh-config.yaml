apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-test
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - nexusguard
    labelSelectors:
      app: maintenance-predictor
  delay:
    latency: "200ms"
    correlation: "25"
    jitter: "50ms"
  target:
    selector:
      namespaces:
        - nexusguard
      labelSelectors:
        app: edge-agent
  duration: "30s"
  scheduler:
    cron: "@every 1h"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-test
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
      - nexusguard
    labelSelectors:
      app: maintenance-predictor
  duration: "10s"
  scheduler:
    cron: "@every 2h"
